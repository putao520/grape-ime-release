name: Sync legal release assets

on:
  release:
    types: [published, edited]
  push:
    paths:
      - LICENSE
      - THIRD-PARTY-NOTICES.md
      - NVIDIA-NOTICE.txt
      - .github/workflows/release-compliance.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-}"
          if [ -z "$tag" ]; then
            tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"
          fi
          if [ -z "$tag" ]; then
            echo "No GitHub Release exists yet; nothing to sync."
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Attach legal files
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG"             LICENSE             THIRD-PARTY-NOTICES.md             NVIDIA-NOTICE.txt             --clobber
